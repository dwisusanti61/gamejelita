<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JELITA - Pos 1: Arena Playgame</title>
  <link rel="manifest" href="manifest.json">
  <link rel="prefetch" href="pos02.html">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #2e7d32;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    .game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #2e7d32 url('assets/images/pos1.png') no-repeat center center;
      background-size: cover;
    }

    /* Tombol Kiri Atas: Sound & Pause */
    .top-left-controls {
      position: absolute;
      top: 3.5%;
      left: 2%;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }

    .top-left-controls button {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s ease;
    }

    .top-left-controls button:hover {
      transform: scale(1.1);
    }

    .top-left-controls img {
      height: min(8vw, 58px);
      width: auto;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
    }

    /* Dashboard Status Kanan Atas */
    .top-right-status {
      position: absolute;
      top: 3.5%;
      right: 3%;
      display: flex;
      align-items: center;
      gap: min(3vw, 18px);
      z-index: 1000;
      background: linear-gradient(180deg, #e53935 0%, #b71c1c 100%);
      padding: 8px min(4vw, 22px);
      border-radius: 30px;
      border: 4px solid #fbc02d;
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-weight: 900;
      font-size: min(4.5vw, 22px);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .yellow-icon {
      color: #ffeb3b;
      font-size: min(5.5vw, 28px);
      line-height: 1;
    }

    /* Drop Zones Keranjang */
    .drop-zone {
      position: absolute;
      bottom: 6%;
      width: min(35vw, 280px);
      height: min(35vh, 220px);
      z-index: 500;
      border-radius: 30px;
    }

    .zone-biotik { left: 23%; }
    .zone-abiotik { left: 58%; }

    /* Kartu Komponen */
    .component-card {
      position: absolute;
      top: 55%;
      left: 54.5%;
      transform: translate(-50%, -50%);
      width: min(22vw, 150px);
      height: min(22vw, 150px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      z-index: 2000;
      touch-action: none;
      filter: drop-shadow(0px 8px 16px rgba(0,0,0,0.5));
    }

    .component-card:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.1);
    }

    .component-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Floating Score (+1 / ❌) */
    .floating-text {
      position: absolute;
      font-size: min(10vw, 60px);
      font-weight: 900;
      z-index: 3000;
      pointer-events: none;
      animation: floatUp 1.1s ease-out forwards;
    }

    .floating-text.plus {
      color: #00e676;
      text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000;
    }

    .floating-text.minus {
      color: #ff1744;
      text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      30% { transform: translateY(-30px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-100px) scale(1); }
    }

    /* Modal Pop-up Evaluasi & Materi */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      position: relative;
      width: min(88vw, 540px);
      max-height: 85vh;
      overflow-y: auto;
      background: #ffffff;
      border: 6px solid #fbc02d;
      border-radius: 25px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .modal-title { font-size: min(5.5vw, 24px); font-weight: 800; color: #1b5e20; margin-bottom: 12px; }
    .modal-desc { font-size: min(3.8vw, 16px); color: #333; margin-bottom: 20px; line-height: 1.5; font-weight: 600; }

    .materi-box {
      background: #f1f8e9;
      border: 2px dashed #7cb342;
      border-radius: 15px;
      padding: 12px 15px;
      margin-bottom: 15px;
      text-align: left;
    }
    .materi-item { margin-bottom: 10px; }
    .materi-item strong { color: #2e7d32; }

    .btn-modal-action {
      padding: 12px 30px;
      font-size: min(4.5vw, 18px);
      font-weight: 800;
      color: #fff;
      background: #2e7d32;
      border: none;
      border-radius: 18px;
      cursor: pointer;
    }

    .btn-go-next {
      position: absolute;
      bottom: 4%;
      right: 3%;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 2000;
      display: none;
    }

    .btn-go-next img {
      height: min(16vw, 100px);
      width: auto;
      filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>

  <div class="game-wrapper" id="gameWrapper">
    <!-- Audio BGM -->
    <audio id="bgMusic" loop preload="auto">
      <source src="assets/audio/audio2.mp3" type="audio/mpeg">
    </audio>

    <!-- Tombol Sound & Pause -->
    <div class="top-left-controls">
      <button id="btnSound" onclick="playAudio()" title="Nyalakan Suara"><img src="assets/images/sound.png" alt="Sound"></button>
      <button id="btnPause" onclick="pauseAudio()" title="Matikan Suara"><img src="assets/images/pause.png" alt="Pause"></button>
    </div>

    <!-- Status Bar -->
    <div class="top-right-status">
      <div class="status-item">
        <span class="yellow-icon">💛</span> <span id="livesText">3</span>
      </div>
      <div class="status-item">
        <span class="yellow-icon">⭐</span> <span id="scoreText">0</span>
      </div>
      <div class="status-item">
        <span class="yellow-icon">⏱️</span> <span id="timerText">90</span>s
      </div>
    </div>

    <!-- Keranjang -->
    <div class="drop-zone zone-biotik" id="zoneBiotik"></div>
    <div class="drop-zone zone-abiotik" id="zoneAbiotik"></div>

    <!-- Tombol GO Lanjut Pos 2 -->
    <button class="btn-go-next" id="btnGoNext" onclick="goPos2()" title="Lanjut ke Pos 2">
      <img src="assets/images/go.png" alt="Lanjut Pos 2">
    </button>
  </div>

  <!-- Pop-up Modal Evaluasi -->
  <div class="modal-overlay" id="gameModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Hasil Permainan</div>
      <div class="modal-desc" id="modalDesc">Keterangan hasil...</div>
      <button class="btn-modal-action" id="btnModalAction">Coba Lagi</button>
    </div>
  </div>

  <script>
    var componentsDB = [
      { id: 'b1', name: 'beringin', type: 'biotik', img: 'assets/images/items/beringin.png' },
      { id: 'b2', name: 'capung', type: 'biotik', img: 'assets/images/items/capung.png' },
      { id: 'b3', name: 'jati', type: 'biotik', img: 'assets/images/items/jati.png' },
      { id: 'b4', name: 'kumbang', type: 'biotik', img: 'assets/images/items/kumbang.png' },
      { id: 'b5', name: 'lumut', type: 'biotik', img: 'assets/images/items/lumut.png' },
      { id: 'b6', name: 'monyet', type: 'biotik', img: 'assets/images/items/monyet.png' },
      { id: 'b7', name: 'paku', type: 'biotik', img: 'assets/images/items/paku.png' },
      { id: 'b8', name: 'sikatan', type: 'biotik', img: 'assets/images/items/sikatan.png' },
      { id: 'b9', name: 'udang', type: 'biotik', img: 'assets/images/items/udang.png' },
      { id: 'b10', name: 'ular', type: 'biotik', img: 'assets/images/items/ular.png' },
      { id: 'b11', name: 'wader', type: 'biotik', img: 'assets/images/items/wader.png' },
      { id: 'a1', name: 'air', type: 'abiotik', img: 'assets/images/items/air.png' },
      { id: 'a2', name: 'angin', type: 'abiotik', img: 'assets/images/items/angin.png' },
      { id: 'a3', name: 'batu', type: 'abiotik', img: 'assets/images/items/batu.png' },
      { id: 'a4', name: 'kelembaban', type: 'abiotik', img: 'assets/images/items/kelembaban.png' },
      { id: 'a5', name: 'kerikil', type: 'abiotik', img: 'assets/images/items/kerikil.png' },
      { id: 'a6', name: 'sinar', type: 'abiotik', img: 'assets/images/items/sinar.png' },
      { id: 'a7', name: 'suhu', type: 'abiotik', img: 'assets/images/items/suhu.png' },
      { id: 'a8', name: 'tanah', type: 'abiotik', img: 'assets/images/items/tanah.png' },
      { id: 'a9', name: 'udara', type: 'abiotik', img: 'assets/images/items/udara.png' }
    ];

    var lives = 3;
    var score = 0;
    var correctCount = 0;
    var currentIndex = 0;
    var activeDeck = [];
    var timer = 90;
    var timerInterval = null;
    var attemptCount = 1;

    var bgMusic = document.getElementById('bgMusic');
    var livesText = document.getElementById('livesText');
    var scoreText = document.getElementById('scoreText');
    var timerText = document.getElementById('timerText');
    var btnGoNext = document.getElementById('btnGoNext');
    var gameModal = document.getElementById('gameModal');
    var modalTitle = document.getElementById('modalTitle');
    var modalDesc = document.getElementById('modalDesc');
    var btnModalAction = document.getElementById('btnModalAction');
    var zoneBiotik = document.getElementById('zoneBiotik');
    var zoneAbiotik = document.getElementById('zoneAbiotik');
    var wrapper = document.getElementById('gameWrapper');

    function playAudio() {
      localStorage.setItem('jelita_bgm_muted', 'false');
      bgMusic.play().catch(function(){});
    }

    function pauseAudio() {
      localStorage.setItem('jelita_bgm_muted', 'true');
      bgMusic.pause();
    }

    function goPos2() {
      if (!bgMusic.paused) localStorage.setItem('jelita_pos1_bgm_time', bgMusic.currentTime.toString());
      window.location.href = 'pos02.html';
    }

    bgMusic.volume = 0.35;
    var savedTime = parseFloat(localStorage.getItem('jelita_pos1_bgm_time') || 0);
    var isMuted = localStorage.getItem('jelita_bgm_muted') === 'true';

    if (!isMuted) {
      if (savedTime > 0) {
        try { bgMusic.currentTime = savedTime; } catch(e){}
      }
      bgMusic.play().catch(function() {
        document.addEventListener('click', function unlock() {
          bgMusic.play();
          document.removeEventListener('click', unlock);
        }, { once: true });
      });
    }

    function startRound() {
      score = 0;
      correctCount = 0;
      currentIndex = 0;
      timer = 90;
      scoreText.textContent = score;
      livesText.textContent = lives;
      timerText.textContent = timer;
      btnGoNext.style.display = 'none';

      activeDeck = componentsDB.slice().sort(function() { return 0.5 - Math.random(); }).slice(0, 10);

      clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        timer--;
        timerText.textContent = timer;
        if (timer <= 0) {
          clearInterval(timerInterval);
          onFail("Waktu 90 detik habis!");
        }
      }, 1000);

      spawnCard();
    }

    function spawnCard() {
      if (currentIndex >= activeDeck.length) {
        onFinish();
        return;
      }

      var item = activeDeck[currentIndex];
      var card = document.createElement('div');
      card.className = 'component-card';
      card.id = 'activeCard';
      card.innerHTML = '<img src="' + item.img + '" alt="' + item.name + '">';

      wrapper.appendChild(card);
      attachDrag(card, item);
    }

    function attachDrag(elm, item) {
      var p1 = 0, p2 = 0, p3 = 0, p4 = 0;

      elm.onmousedown = function(e) {
        e.preventDefault();
        p3 = e.clientX; p4 = e.clientY;
        document.onmouseup = drop;
        document.onmousemove = move;
      };

      elm.ontouchstart = function(e) {
        var t = e.touches[0];
        p3 = t.clientX; p4 = t.clientY;
        document.ontouchend = drop;
        document.ontouchmove = moveTouch;
      };

      function move(e) {
        e.preventDefault();
        p1 = p3 - e.clientX; p2 = p4 - e.clientY;
        p3 = e.clientX; p4 = e.clientY;
        elm.style.top = (elm.offsetTop - p2) + "px";
        elm.style.left = (elm.offsetLeft - p1) + "px";
      }

      function moveTouch(e) {
        var t = e.touches[0];
        p1 = p3 - t.clientX; p2 = p4 - t.clientY;
        p3 = t.clientX; p4 = t.clientY;
        elm.style.top = (elm.offsetTop - p2) + "px";
        elm.style.left = (elm.offsetLeft - p1) + "px";
      }

      function drop() {
        document.onmouseup = null; document.onmousemove = null;
        document.ontouchend = null; document.ontouchmove = null;

        var rect = elm.getBoundingClientRect();
        var bRect = zoneBiotik.getBoundingClientRect();
        var aRect = zoneAbiotik.getBoundingClientRect();

        var choice = null;
        if (hitTest(rect, bRect)) choice = 'biotik';
        else if (hitTest(rect, aRect)) choice = 'abiotik';

        if (choice === item.type) {
          score++; correctCount++;
          scoreText.textContent = score;
          popText('+1', rect.left, rect.top, 'plus');
          elm.remove();
          currentIndex++;
          spawnCard();
        } else if (choice !== null) {
          popText('❌', rect.left, rect.top, 'minus');
          elm.remove();
          currentIndex++;
          spawnCard();
        } else {
          elm.style.top = '55%';
          elm.style.left = '54.5%';
        }
      }
    }

    function hitTest(r1, r2) {
      return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
    }

    function popText(txt, x, y, cls) {
      var el = document.createElement('div');
      el.className = 'floating-text ' + cls;
      el.textContent = txt;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.body.appendChild(el);
      setTimeout(function() { el.remove(); }, 1000);
    }

    function onFinish() {
      clearInterval(timerInterval);
      
      var existingExitBtn = document.getElementById('btnModalExit');
      if (existingExitBtn) existingExitBtn.style.display = 'none';

      if (correctCount >= 8) {
        var bonus = 0;
        if (attemptCount === 1) bonus = 4;
        else if (attemptCount === 2) bonus = 2;
        else if (attemptCount >= 3) bonus = 1;

        score += bonus;
        scoreText.textContent = score;

        /* PERSISTENSI POIN UNTUK FINISH.HTML */
        try {
          localStorage.setItem('jelita_stars_pos1', score.toString());
          localStorage.setItem('jelita_score_pos1', score.toString());
          localStorage.setItem('jelita_time_pos1', timer.toString());
          localStorage.setItem('jelita_pos1_lives', lives.toString());
        } catch(e){}

        modalTitle.textContent = "🎉 Selamat, Petualang!";
        modalDesc.style.textAlign = "center";
        modalDesc.innerHTML = "Kamu berhasil mengelompokkan <strong>" + correctCount + " dari 10</strong> komponen dengan benar!<br>" +
                              "<span style='color:#2e7d32; font-weight:800;'>🎁 Bonus Lolos (Kesempatan ke-" + attemptCount + "): +" + bonus + " Poin!</span><br>" +
                              "Total Poin Pos 1: <strong>" + score + "</strong>";
        btnModalAction.textContent = "Lihat Rangkuman Materi";
        gameModal.style.display = 'flex';

        btnModalAction.onclick = function() {
          showMateriPopup();
        };
      } else {
        onFail("Hanya berhasil " + correctCount + " komponen. Minimal harus 8 komponen benar.");
      }
    }

    function showMateriPopup() {
      var existingExitBtn = document.getElementById('btnModalExit');
      if (existingExitBtn) existingExitBtn.style.display = 'none';

      modalTitle.textContent = "📚 Ulasan Materi: Biotik & Abiotik";
      modalDesc.style.textAlign = "left";
      modalDesc.innerHTML = 
        '<div class="materi-box">' +
          '<div class="materi-item">' +
            '<strong>1. Komponen Biotik (Makhluk Hidup)</strong><br>' +
            'Semua makhluk hidup di ekosistem.<br>' +
            '• <em>Produsen:</em> Tumbuhan hijau (Beringin, Jati, Paku, Lumut) yang melakukan fotosintesis.<br>' +
            '• <em>Konsumen:</em> Hewan pemakan tumbuhan/daging (Monyet, Ular, Burung, Ikan, Capung).' +
          '</div>' +
          '<div class="materi-item">' +
            '<strong>2. Komponen Abiotik (Benda Tak Hidup)</strong><br>' +
            'Faktor fisik & kimia penunjang kehidupan.<br>' +
            '• <em>Contoh:</em> Air, Udara, Sinar Matahari, Tanah, Batu, Suhu, dan Kelembaban.' +
          '</div>' +
          '<div class="materi-item">' +
            '<strong>3. Kunci Ekosistem</strong><br>' +
            'Biotik dan Abiotik <strong>saling berinteraksi</strong>! Tumbuhan butuh tanah & sinar matahari untuk tumbuh, sedangkan hewan membutuhkan air & udara untuk bertahan hidup.' +
          '</div>' +
        '</div>';
      
      btnModalAction.textContent = "Lanjut Pos 2";

      btnModalAction.onclick = function() {
        gameModal.style.display = 'none';
        btnGoNext.style.display = 'block';
      };
    }

    function onFail(msg) {
      clearInterval(timerInterval);
      lives--;
      livesText.textContent = lives;
      attemptCount++;

      var card = document.getElementById('activeCard');
      if (card) card.remove();

      if (lives > 0) {
        var existingExitBtn = document.getElementById('btnModalExit');
        if (existingExitBtn) existingExitBtn.style.display = 'none';

        modalTitle.textContent = "⚠️ Belum Berhasil!";
        modalDesc.style.textAlign = "center";
        modalDesc.innerHTML = msg + "<br>Nyawamu berkurang 1. Sisa nyawa: <strong>" + lives + "</strong>.";
        btnModalAction.textContent = "Coba Lagi";
        gameModal.style.display = 'flex';

        btnModalAction.onclick = function() {
          gameModal.style.display = 'none';
          startRound();
        };
      } else {
        // STATE GAME OVER (Kesempatan Habis)
        modalTitle.textContent = "💔 Game Over";
        modalDesc.style.textAlign = "center";
        modalDesc.innerHTML = "Nyawamu telah habis!";
        
        btnModalAction.textContent = "🔄 Coba Lagi";
        btnModalAction.onclick = function() {
          localStorage.removeItem('jelita_pos1_bgm_time');
          window.location.href = 'pos01.html';
        };

        var existingExitBtn = document.getElementById('btnModalExit');
        if (!existingExitBtn) {
          var exitBtn = document.createElement('button');
          exitBtn.id = 'btnModalExit';
          exitBtn.textContent = '🚪 Keluar';
          exitBtn.style.cssText = 'margin-left: 10px; padding: 12px 30px; font-size: 18px; font-weight: 800; color: #fff; background: #d32f2f; border: none; border-radius: 18px; cursor: pointer;';
          btnModalAction.parentNode.appendChild(exitBtn);
          existingExitBtn = exitBtn;
        }
        
        existingExitBtn.style.display = 'inline-block';
        existingExitBtn.onclick = function() {
          localStorage.removeItem('jelita_pos1_bgm_time');
          window.location.href = 'index.html';
        };

        gameModal.style.display = 'flex';
      }
    }

    startRound();
  </script>
</body>
</html>
