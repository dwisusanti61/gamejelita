<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JELITA - Petualangan Ekologi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #1b5e20;
    }
    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Tombol bantuan layar penuh kecil di pojok bawah jika belum fullscreen */
    #btnFsHelper {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #ffd54f;
      border: 1.5px solid #ffd54f;
      padding: 6px 16px;
      border-radius: 20px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      z-index: 9999;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #1b5e20;
      color: #ffffff;
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    @media screen and (orientation: portrait) {
      #rotate-warning { display: flex; }
    }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <div style="font-size: 56px; margin-bottom: 12px;">📱🔄</div>
    <h2>Putar Layar HP Kamu</h2>
    <p style="margin-top: 8px; font-size: 14px; opacity: 0.9;">Miringkan HP ke posisi mendatar (Landscape) agar game tampil penuh dan rapi.</p>
  </div>

  <button id="btnFsHelper" onclick="aktifkanFullScreenUtama()">⛶ Klik Layar Penuh</button>

  <iframe id="gameFrame" src="intro.html" allow="autoplay; fullscreen"></iframe>

  <script>
    var btnFs = document.getElementById('btnFsHelper');

    function aktifkanFullScreenUtama() {
      var elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().then(function() {
            if (btnFs) btnFs.style.display = 'none';
          }).catch(function() {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
          if (btnFs) btnFs.style.display = 'none';
        }
      }
    }

    // Sembunyikan tombol bantu jika sudah mode fullscreen atau dibuka sebagai aplikasi PWA
    document.addEventListener('fullscreenchange', function() {
      if (btnFs) btnFs.style.display = document.fullscreenElement ? 'none' : 'block';
    });

    if (window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches) {
      if (btnFs) btnFs.style.display = 'none';
    }

    window.addEventListener('message', function(event) {
      if (event.data === 'REQUEST_FULLSCREEN') {
        aktifkanFullScreenUtama();
      }
    });
  </script>
</body>
</html>
