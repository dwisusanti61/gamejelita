<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JELITA - Petualangan Ekologi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #1b5e20;
    }
    #gameFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #rotate-warning {
      display: none;
      position: fixed;
      inset: 0;
      background: #1b5e20;
      color: #ffffff;
      z-index: 99999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    @media screen and (orientation: portrait) {
      #rotate-warning { display: flex; }
    }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <div style="font-size: 56px; margin-bottom: 12px;">📱🔄</div>
    <h2>Putar Layar HP Kamu</h2>
    <p style="margin-top: 8px; font-size: 14px; opacity: 0.9;">Miringkan HP ke posisi mendatar (Landscape) agar game tampil penuh dan rapi.</p>
  </div>

  <iframe id="gameFrame" src="intro.html" allow="autoplay; fullscreen"></iframe>

  <script>
    function aktifkanFullScreenUtama() {
      var elem = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen().catch(function() {});
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      }
    }

    // Aktifkan fullscreen sekali saat sentuhan/klik pertama di halaman pembuka
    window.addEventListener('message', function(event) {
      if (event.data === 'REQUEST_FULLSCREEN') {
        aktifkanFullScreenUtama();
      }
    });

    document.addEventListener('click', aktifkanFullScreenUtama, { once: true });
    document.addEventListener('touchstart', aktifkanFullScreenUtama, { once: true });
  </script>
</body>
</html>
