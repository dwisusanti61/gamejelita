<!DOCTYPE html>
<html lang="id">
  <link rel="stylesheet" href="jelita-fix.css">
  <script src="jelita-fix.js" defer></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JELITA - Peta Petualangan</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { 
      width: 100vw; 
      height: 100vh; 
      height: 100dvh; 
      overflow: hidden; 
      background-color: #2e7d32; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
    }
    .game-wrapper { 
      position: relative; 
      width: 100%; 
      height: 100%; 
      background: #2e7d32 url('assets/images/map.png') no-repeat center center; 
      background-size: 100% 100%; 
    }

    .logo-jelita-top { position: absolute; top: 3.5%; left: 2.5%; height: 13dvh; max-height: 70px; width: auto; z-index: 1000; pointer-events: none; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4)); }

    .top-right-controls { position: absolute; top: 3.5%; right: 3%; display: flex; gap: 1.5dvh; z-index: 1000; }
    .top-right-controls button { background: none; border: none; cursor: pointer; outline: none; transition: transform 0.15s; }
    .top-right-controls button:hover { transform: scale(1.1); }
    .top-right-controls img { height: 10dvh; max-height: 55px; width: auto; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4)); }

    .btn-action { position: absolute; background: none; border: none; cursor: pointer; outline: none; z-index: 1000; transition: transform 0.15s, filter 0.15s; }
    .btn-action:hover { transform: scale(1.08); filter: brightness(1.1); }
    .btn-action:active { transform: scale(0.92); }

    .btn-back { bottom: 4.5%; left: 3%; }
    .btn-back img { height: 15dvh; max-height: 90px; width: auto; filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.5)); }

    .btn-go { bottom: 4.5%; right: 3%; }
    .btn-go img { height: 15dvh; max-height: 90px; width: auto; filter: drop-shadow(0px 5px 10px rgba(0,0,0,0.5)); }

    #rotate-warning { display: none; position: fixed; inset: 0; background: #1b5e20; color: #ffffff; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    @media screen and (orientation: portrait) { #rotate-warning { display: flex; } }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <div style="font-size: 56px; margin-bottom: 12px;">📱🔄</div>
    <h2>Putar Layar HP Kamu</h2>
    <p style="margin-top: 8px; font-size: 14px; opacity: 0.9;">Miringkan HP ke posisi mendatar (Landscape) agar game tampil penuh dan rapi.</p>
  </div>

  <div class="game-wrapper">
    <img src="assets/images/jelita.png" alt="Logo JELITA" class="logo-jelita-top">

    <audio id="bgMusic" loop preload="metadata">
      <source src="assets/audio/audio1.mp3" type="audio/mpeg">
    </audio>

    <div class="top-right-controls">
      <button id="btnHome" title="Kembali ke Menu Utama"><img src="assets/images/home.png" alt="Home"></button>
      <button id="btnSound" title="Nyalakan Suara"><img src="assets/images/sound.png" alt="Sound"></button>
      <button id="btnPause" title="Matikan Suara"><img src="assets/images/pause.png" alt="Pause"></button>
    </div>

    <button class="btn-action btn-back" id="btnBack" title="Kembali ke Menu Utama"><img src="assets/images/back.png" alt="Kembali"></button>
    <button class="btn-action btn-go" id="btnGo" title="Masuk ke Pos 01"><img src="assets/images/go.png" alt="Go"></button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const bgMusic = document.getElementById('bgMusic');
      const btnHome = document.getElementById('btnHome');
      const btnSound = document.getElementById('btnSound');
      const btnPause = document.getElementById('btnPause');
      const btnBack = document.getElementById('btnBack');
      const btnGo = document.getElementById('btnGo');

      bgMusic.volume = 0.35;
      const savedTime = parseFloat(localStorage.getItem('jelita_bgm_time') || 0);
      const isMuted = localStorage.getItem('jelita_bgm_muted') === 'true';

      function lanjutkanMusik() {
        if (!isMuted) {
          if (savedTime > 0 && Math.abs(bgMusic.currentTime - savedTime) > 0.5) {
            try { bgMusic.currentTime = savedTime; } catch(e) {}
          }
          if (bgMusic.paused) {
            bgMusic.play().catch(() => {});
          }
        }
      }

      bgMusic.addEventListener('loadedmetadata', lanjutkanMusik, { once: true });
      lanjutkanMusik();

      bgMusic.addEventListener('timeupdate', () => {
        if (!bgMusic.paused && bgMusic.currentTime > 0) {
          localStorage.setItem('jelita_bgm_time', bgMusic.currentTime.toString());
        }
      });

      if (btnHome) btnHome.addEventListener('click', () => { if (bgMusic.currentTime > 0) localStorage.setItem('jelita_bgm_time', bgMusic.currentTime.toString()); window.location.href = 'menu.html'; });
      if (btnSound) btnSound.addEventListener('click', () => { localStorage.setItem('jelita_bgm_muted', 'false'); bgMusic.play(); });
      if (btnPause) btnPause.addEventListener('click', () => { localStorage.setItem('jelita_bgm_muted', 'true'); bgMusic.pause(); });
      if (btnBack) btnBack.addEventListener('click', () => { if (bgMusic.currentTime > 0) localStorage.setItem('jelita_bgm_time', bgMusic.currentTime.toString()); window.location.href = 'menu.html'; });
      if (btnGo) btnGo.addEventListener('click', () => { localStorage.setItem('jelita_bgm_time', '0'); window.location.href = 'pos01.html'; });
    });
  </script>
</body>
</html>
