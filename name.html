<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JELITA - Masukkan Nama</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" as="image" href="assets/images/name.png">
  <link rel="prefetch" href="menu.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    
    html, body { 
      width: 100vw; 
      height: 100vh; 
      height: 100dvh; 
      overflow: hidden; 
      background-color: #1b5e20;
      font-family: 'Segoe UI', Roboto, sans-serif; 
    }

    /* 1 Latar Penuh Bersih (Tanpa Dobel/Bayangan) */
    .game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #2e7d32 url('assets/images/name.png') no-repeat center center;
      background-size: 100% 100%;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .game-wrapper.ready { opacity: 1; }

    .top-logo { position: absolute; top: 3.5%; z-index: 1000; pointer-events: none; height: 13dvh; max-height: 75px; width: auto; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4)); }
    .logo-ipa { left: 3%; }
    .logo-jelita { right: 3%; }

    /* Lebar kotak input disesuaikan dengan tinggi layar (dvh) agar pas di dalam bingkai gambar */
    .input-container {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(65dvh, 360px);
      z-index: 1000;
      text-align: center;
    }
    .input-name {
      width: 100%;
      padding: 1.8dvh 14px;
      font-size: clamp(14px, 3.8dvh, 22px);
      font-weight: 800;
      color: #1b5e20;
      text-align: center;
      background: #ffffff;
      border: 3px solid #fbc02d;
      border-radius: 14px;
      outline: none;
      text-transform: capitalize;
      user-select: text;
      -webkit-user-select: text;
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.15), 0 6px 15px rgba(0,0,0,0.3);
    }
    .input-name::placeholder { color: #9e9e9e; font-weight: normal; font-style: italic; font-size: clamp(11px, 3dvh, 17px); }

    .btn-jelajah { position: absolute; bottom: 5%; left: 50%; transform: translateX(-50%); background: none; border: none; cursor: pointer; outline: none; z-index: 1000; transition: transform 0.15s ease; }
    .btn-jelajah img { height: 15dvh; max-height: 90px; width: auto; filter: drop-shadow(0px 6px 14px rgba(0,0,0,0.5)); }
    .btn-jelajah:active { transform: translateX(-50%) scale(0.92); }

    .toast-warning { display: none; position: fixed; top: 12%; left: 50%; transform: translateX(-50%); background: #e53935; color: #ffffff; padding: 8px 20px; border-radius: 12px; font-weight: bold; font-size: clamp(12px, 3.2dvh, 16px); box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 2000; }

    #rotate-warning { display: none; position: fixed; inset: 0; background: #1b5e20; color: #ffffff; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    @media screen and (orientation: portrait) { #rotate-warning { display: flex; } }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <div style="font-size: 56px; margin-bottom: 12px;">📱🔄</div>
    <h2>Putar Layar HP Kamu</h2>
    <p style="margin-top: 8px; font-size: 14px; opacity: 0.9;">Miringkan HP ke posisi mendatar (Landscape) agar game tampil penuh dan rapi.</p>
  </div>

  <div class="game-wrapper" id="gameWrapper">
    <img src="assets/images/ipa.png" alt="IPA" class="top-logo logo-ipa" onerror="this.style.display='none'">
    <img src="assets/images/jelita.png" alt="JELITA" class="top-logo logo-jelita" onerror="this.style.display='none'">

    <audio id="bgMusic" loop preload="auto">
      <source src="assets/audio/audio1.mp3" type="audio/mpeg">
    </audio>

    <div class="input-container">
      <input type="text" id="playerName" class="input-name" placeholder="Tuliskan nama kamu di sini..." autocomplete="off" maxlength="25">
    </div>

    <button class="btn-jelajah" id="btnJelajah" title="Mulai Jelajah">
      <img src="assets/images/jelajah.png" alt="Mulai Jelajah">
    </button>
  </div>

  <div class="toast-warning" id="toastWarning">⚠️ Isi namamu dulu ya, Petualang!</div>

  <script>
    (function() {
      var wrapper = document.getElementById('gameWrapper');
      var bgImg = new Image();
      bgImg.src = 'assets/images/name.png';
      bgImg.onload = function() { if (wrapper) wrapper.classList.add('ready'); };
      bgImg.onerror = function() { if (wrapper) wrapper.classList.add('ready'); };
      setTimeout(function() { if (wrapper) wrapper.classList.add('ready'); }, 1200);
    })();

    // Auto-pause musik saat keluar browser / kunci layar HP
    document.addEventListener('visibilitychange', function() {
      var musik = document.getElementById('bgMusic');
      if (!musik) return;
      if (document.hidden) {
        musik.pause();
      } else if (localStorage.getItem('jelita_bgm_muted') !== 'true') {
        musik.play().catch(function() {});
      }
    });

    function masukFullScreen() {
      var elem = document.documentElement;
      if (!document.fullscreenElement && elem.requestFullscreen) {
        elem.requestFullscreen().catch(function() {});
      } else if (!document.webkitFullscreenElement && elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }
    document.addEventListener('touchstart', masukFullScreen, { once: true });
    document.addEventListener('click', masukFullScreen, { once: true });

    document.addEventListener('DOMContentLoaded', function() {
      var btnJelajah = document.getElementById('btnJelajah');
      var playerNameInput = document.getElementById('playerName');
      var toastWarning = document.getElementById('toastWarning');
      var bgMusic = document.getElementById('bgMusic');

      bgMusic.volume = 0.5;
      var savedTime = parseFloat(localStorage.getItem('jelita_bgm_time') || 0);
      var isMuted = localStorage.getItem('jelita_bgm_muted') === 'true';

      function playMusic() {
        if (!isMuted) {
          if (savedTime > 0) { try { bgMusic.currentTime = savedTime; } catch(e){} }
          bgMusic.play().catch(function() {
            var unlock = function() { bgMusic.play(); document.removeEventListener('click', unlock); document.removeEventListener('touchstart', unlock); };
            document.addEventListener('click', unlock);
            document.addEventListener('touchstart', unlock);
          });
        }
      }

      if (bgMusic.readyState >= 1) playMusic();
      else bgMusic.addEventListener('loadedmetadata', playMusic, { once: true });

      bgMusic.addEventListener('timeupdate', function() {
        if (!bgMusic.paused && bgMusic.currentTime > 0) localStorage.setItem('jelita_bgm_time', bgMusic.currentTime.toString());
      });

      playerNameInput.addEventListener('input', function(e) {
        e.target.value = e.target.value.replace(/\b\w/g, function(char) { return char.toUpperCase(); });
      });

      btnJelajah.addEventListener('click', function(e) {
        e.preventDefault();
        masukFullScreen();
        var nama = playerNameInput.value.trim();
        if (nama === "") {
          toastWarning.style.display = 'block';
          playerNameInput.focus();
          setTimeout(function() { toastWarning.style.display = 'none'; }, 2500);
          return;
        }
        localStorage.setItem('jelita_player_name', nama);
        if (!bgMusic.paused) localStorage.setItem('jelita_bgm_time', bgMusic.currentTime.toString());
        window.location.href = 'menu.html';
      });
    });
  </script>
</body>
</html>
