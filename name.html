<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JELITA - Masukkan Nama</title>
  <link rel="manifest" href="manifest.json">
  <link rel="prefetch" href="menu.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #2e7d32; font-family: 'Segoe UI', Roboto, sans-serif; }
    .game-wrapper { position: relative; width: 100vw; height: 100vh; background: #2e7d32 url('assets/images/name.png') no-repeat center center; background-size: cover; }

    .top-logo { position: absolute; top: 3%; z-index: 1000; pointer-events: none; }
    .logo-ipa { left: 3%; height: min(12vw, 75px); width: auto; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4)); }
    .logo-jelita { right: 3%; height: min(12vw, 75px); width: auto; filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4)); }

    .input-container { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); width: min(65vw, 500px); z-index: 1000; text-align: center; }
    .input-name { width: 100%; padding: 14px 24px; font-size: min(6vw, 26px); font-weight: 800; color: #1b5e20; text-align: center; background: #ffffff; border: 5px solid #fbc02d; border-radius: 22px; outline: none; text-transform: capitalize; user-select: text; box-shadow: inset 0 4px 8px rgba(0,0,0,0.15), 0 8px 20px rgba(0,0,0,0.3); }
    .input-name::placeholder { color: #9e9e9e; font-weight: normal; font-style: italic; font-size: min(4vw, 20px); }

    .btn-jelajah { position: absolute; top: 79%; left: 50%; transform: translateX(-50%); background: none; border: none; cursor: pointer; outline: none; z-index: 1000; transition: transform 0.2s ease, filter 0.2s ease; }
    .btn-jelajah img { height: min(18vw, 110px); width: auto; filter: drop-shadow(0px 6px 14px rgba(0,0,0,0.5)); }
    .btn-jelajah:hover { transform: translateX(-50%) scale(1.08); filter: brightness(1.1); }
    .btn-jelajah:active { transform: translateX(-50%) scale(0.92); }

    .toast-warning { display: none; position: fixed; top: 12%; left: 50%; transform: translateX(-50%); background: #e53935; color: #ffffff; padding: 12px 28px; border-radius: 16px; font-weight: bold; font-size: min(4vw, 18px); box-shadow: 0 5px 15px rgba(0,0,0,0.4); z-index: 2000; }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <img src="assets/images/ipa.png" alt="IPA" class="top-logo logo-ipa" onerror="this.style.display='none'">
    <img src="assets/images/jelita.png" alt="JELITA" class="top-logo logo-jelita" onerror="this.style.display='none'">

    <audio id="bgMusic" loop preload="auto">
      <source src="assets/audio/audio1.mp3" type="audio/mpeg">
    </audio>

    <div class="input-container">
      <input type="text" id="playerName" class="input-name" placeholder="Tuliskan nama kamu di sini..." autocomplete="off" maxlength="25">
    </div>

    <button class="btn-jelajah" id="btnJelajah" title="Mulai Jelajah">
      <img src="assets/images/jelajah.png" alt="Mulai Jelajah">
    </button>
  </div>

  <div class="toast-warning" id="toastWarning">⚠️ Isi namamu dulu ya, Petualang!</div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnJelajah = document.getElementById('btnJelajah');
      const playerNameInput = document.getElementById('playerName');
      const toastWarning = document.getElementById('toastWarning');
      const bgMusic = document.getElementById('bgMusic');

      bgMusic.volume = 0.5;

      const savedTime = parseFloat(localStorage.getItem('jelita_bgm_time') || 0);
      const isMuted = localStorage.getItem('jelita_bgm_muted') === 'true';

      function playMusic() {
        if (!isMuted) {
          if (savedTime > 0) {
            try { bgMusic.currentTime = savedTime; } catch(e){}
          }
          bgMusic.play().catch(() => {
            const unlock = () => {
              bgMusic.play();
              document.removeEventListener('click', unlock);
              document.removeEventListener('touchstart', unlock);
            };
            document.addEventListener('click', unlock);
            document.addEventListener('touchstart', unlock);
          });
        }
      }

      if (bgMusic.readyState >= 1) {
        playMusic();
      } else {
        bgMusic.addEventListener('loadedmetadata', playMusic, { once: true });
      }

      bgMusic.addEventListener('timeupdate', () => {
        if (!bgMusic.paused && bgMusic.currentTime > 0) {
          localStorage.setItem('jelita_bgm_time', bgMusic.currentTime.toString());
        }
      });

      playerNameInput.addEventListener('input', (e) => {
        let val = e.target.value;
        e.target.value = val.replace(/\b\w/g, char => char.toUpperCase());
      });

      btnJelajah.addEventListener('click', (e) => {
        e.preventDefault();
        const nama = playerNameInput.value.trim();
        
        if (nama === "") {
          toastWarning.style.display = 'block';
          playerNameInput.focus();
          setTimeout(() => toastWarning.style.display = 'none', 2500);
          return;
        }

        localStorage.setItem('jelita_player_name', nama);
        if (!bgMusic.paused) {
          localStorage.setItem('jelita_bgm_time', bgMusic.currentTime.toString());
        }
        window.location.href = 'menu.html';
      });
    });
  </script>
</body>
</html>
