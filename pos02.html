<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JELITA - Pos 2: Kedung Pasiraman</title>
  <link rel="manifest" href="manifest.json">
  <link rel="prefetch" href="pos2.html">
  <link rel="prefetch" href="menu.html">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #00796b;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    /* Fullscreen Wrapper Latar pos02.png */
    .game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #00796b url('assets/images/pos02.png') no-repeat center center;
      background-size: cover;
    }

    /* Logo JELITA di Pojok Kiri Atas */
    .logo-jelita-top {
      position: absolute;
      top: 3%;
      left: 2%;
      height: min(13vw, 70px);
      width: auto;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
      pointer-events: none;
      z-index: 1000;
    }

    /* Style Tombol Aksi Universal */
    .btn-action {
      position: absolute;
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      z-index: 1000;
      transition: transform 0.2s ease, filter 0.2s ease;
      pointer-events: auto;
    }

    .btn-action:hover {
      transform: scale(1.1);
      filter: brightness(1.1);
    }

    .btn-action:active {
      transform: scale(0.92);
    }

    /* Group 3 Tombol Pojok Kanan Atas: Home, Sound, Pause */
    .top-right-controls {
      position: absolute;
      top: 3.5%;
      right: 3%;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }

    .top-right-controls button {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s ease, filter 0.2s ease;
      pointer-events: auto;
    }

    .top-right-controls button:hover {
      transform: scale(1.1);
      filter: brightness(1.1);
    }

    .top-right-controls button:active {
      transform: scale(0.92);
    }

    .top-right-controls img {
      height: min(8vw, 55px);
      width: auto;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
    }

    /* Tombol Siap Nadia di Kanan Bawah */
    .btn-siapnadia {
      bottom: 4%;
      right: 3%;
    }

    .btn-siapnadia img {
      height: min(16vw, 100px);
      width: auto;
      filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.5));
    }

    /* Penyesuaian HP Landscape */
    @media (max-height: 500px) {
      .logo-jelita-top {
        height: 45px;
      }
      .top-right-controls img {
        height: 40px;
      }
      .btn-siapnadia img {
        height: min(20vw, 75px);
      }
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- Logo JELITA Pojok Kiri Atas -->
    <img src="assets/images/jelita.png" alt="Logo JELITA" class="logo-jelita-top">

    <!-- Audio Lokal Pos 2 (audio3.mp3) -->
    <audio id="bgMusic" loop preload="auto">
      <source src="assets/audio/audio3.mp3" type="audio/mpeg">
    </audio>

    <!-- Group 3 Tombol Kanan Atas (Home, Sound, Pause) -->
    <div class="top-right-controls">
      <button id="btnHome" title="Kembali ke Menu Utama">
        <img src="assets/images/home.png" alt="Home">
      </button>
      <button id="btnSound" title="Nyalakan Suara">
        <img src="assets/images/sound.png" alt="Sound">
      </button>
      <button id="btnPause" title="Matikan Suara">
        <img src="assets/images/pause.png" alt="Pause">
      </button>
    </div>

    <!-- Tombol Siap Nadia (Kanan Bawah -> pos2.html) -->
    <button class="btn-action btn-siapnadia" id="btnSiapNadia" title="Siap, Nadia!">
      <img src="assets/images/siapnadia.png" alt="Siap, Nadia!">
    </button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var btnHome = document.getElementById('btnHome');
      var btnSound = document.getElementById('btnSound');
      var btnPause = document.getElementById('btnPause');
      var btnSiapNadia = document.getElementById('btnSiapNadia');
      var bgMusic = document.getElementById('bgMusic');

      bgMusic.volume = 0.35;

      // Ambil detik tersimpan audio3.mp3 & status mute
      var savedPos2Time = parseFloat(localStorage.getItem('jelita_pos2_bgm_time') || 0);
      var isMuted = localStorage.getItem('jelita_bgm_muted') === 'true';

      function playMusic() {
        if (!isMuted) {
          if (savedPos2Time > 0) {
            try { bgMusic.currentTime = savedPos2Time; } catch(e){}
          }
          bgMusic.play().catch(function() {
            function unlock() {
              bgMusic.play();
              document.removeEventListener('click', unlock);
              document.removeEventListener('touchstart', unlock);
            }
            document.addEventListener('click', unlock);
            document.addEventListener('touchstart', unlock);
          });
        }
      }

      if (bgMusic.readyState >= 1) {
        playMusic();
      } else {
        bgMusic.addEventListener('loadedmetadata', playMusic, { once: true });
      }

      // Catat detik lagu audio3.mp3 secara berkala
      bgMusic.addEventListener('timeupdate', function() {
        if (!bgMusic.paused && bgMusic.currentTime > 0) {
          localStorage.setItem('jelita_pos2_bgm_time', bgMusic.currentTime.toString());
        }
      });

      // Kontrol Suara (Sound & Pause)
      if (btnSound) {
        btnSound.addEventListener('click', function() {
          localStorage.setItem('jelita_bgm_muted', 'false');
          bgMusic.play();
        });
      }

      if (btnPause) {
        btnPause.addEventListener('click', function() {
          localStorage.setItem('jelita_bgm_muted', 'true');
          bgMusic.pause();
        });
      }

      // Navigasi Home -> Reset Audio Pos 2 -> Kembali ke menu.html
      if (btnHome) {
        btnHome.addEventListener('click', function(e) {
          e.preventDefault();
          localStorage.removeItem('jelita_pos2_bgm_time');
          window.location.href = 'menu.html';
        });
      }

      // Navigasi Siap Nadia -> Lanjut ke pos2.html (audio3.mp3 tetap berlanjut tanpa terputus)
      if (btnSiapNadia) {
        btnSiapNadia.addEventListener('click', function(e) {
          e.preventDefault();
          if (!bgMusic.paused) {
            localStorage.setItem('jelita_pos2_bgm_time', bgMusic.currentTime.toString());
          }
          window.location.href = 'pos2.html';
        });
      }
    });
  </script>
</body>
</html>
