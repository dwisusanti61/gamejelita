<!DOCTYPE html>
<html lang="id">
 <link rel="stylesheet" href="jelita-fix.css">
  <script src="jelita-fix.js" defer></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JELITA - Pos 2: Kedung Pasiraman</title>
  <link rel="manifest" href="manifest.json">
  <link rel="prefetch" href="pos2.html">
  <link rel="prefetch" href="menu.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; background-color: #00796b; font-family: 'Segoe UI', Roboto, sans-serif; }
    .game-wrapper { position: relative; width: 100%; height: 100%; background: #00796b url('assets/images/pos02.png') no-repeat center center; background-size: 100% 100%; }

    .logo-jelita-top { position: absolute; top: 3.5%; left: 2.5%; height: 13dvh; max-height: 70px; width: auto; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4)); pointer-events: none; z-index: 1000; }

    .btn-action { position: absolute; background: none; border: none; cursor: pointer; outline: none; z-index: 1000; transition: transform 0.15s ease, filter 0.15s ease; pointer-events: auto; }
    .btn-action:hover { transform: scale(1.1); filter: brightness(1.1); }
    .btn-action:active { transform: scale(0.92); }

    .top-right-controls { position: absolute; top: 3.5%; right: 3%; display: flex; align-items: center; gap: 1.5dvh; z-index: 1000; }
    .top-right-controls button { background: none; border: none; cursor: pointer; outline: none; transition: transform 0.15s ease, filter 0.15s ease; pointer-events: auto; }
    .top-right-controls button:hover { transform: scale(1.1); filter: brightness(1.1); }
    .top-right-controls button:active { transform: scale(0.92); }
    .top-right-controls img { height: 10dvh; max-height: 55px; width: auto; filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4)); }

    .btn-siapnadia { bottom: 4.5%; right: 3%; }
    .btn-siapnadia img { height: 16dvh; max-height: 100px; width: auto; filter: drop-shadow(0px 5px 10px rgba(0, 0, 0, 0.5)); }

    #rotate-warning { display: none; position: fixed; inset: 0; background: #1b5e20; color: #ffffff; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    @media screen and (orientation: portrait) { #rotate-warning { display: flex; } }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <div style="font-size: 56px; margin-bottom: 12px;">📱🔄</div>
    <h2>Putar Layar HP Kamu</h2>
    <p style="margin-top: 8px; font-size: 14px; opacity: 0.9;">Miringkan HP ke posisi mendatar (Landscape) agar game tampil penuh dan rapi.</p>
  </div>

  <div class="game-wrapper">
    <img src="assets/images/jelita.png" alt="Logo JELITA" class="logo-jelita-top">

    <audio id="bgMusic" loop preload="auto">
      <source src="assets/audio/audio3.mp3" type="audio/mpeg">
    </audio>

    <div class="top-right-controls">
      <button id="btnHome" title="Kembali ke Menu Utama"><img src="assets/images/home.png" alt="Home"></button>
      <button id="btnSound" title="Nyalakan Suara"><img src="assets/images/sound.png" alt="Sound"></button>
      <button id="btnPause" title="Matikan Suara"><img src="assets/images/pause.png" alt="Pause"></button>
    </div>

    <button class="btn-action btn-siapnadia" id="btnSiapNadia" title="Siap, Nadia!">
      <img src="assets/images/siapnadia.png" alt="Siap, Nadia!">
    </button>
  </div>

  <script>
    function masukFullScreen() {
      var elem = document.documentElement;
      if (!document.fullscreenElement && elem.requestFullscreen) {
        elem.requestFullscreen().catch(function() {});
      } else if (!document.webkitFullscreenElement && elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }
    document.addEventListener('touchstart', masukFullScreen, { once: true });
    document.addEventListener('click', masukFullScreen, { once: true });

    document.addEventListener('DOMContentLoaded', function() {
      var btnHome = document.getElementById('btnHome');
      var btnSound = document.getElementById('btnSound');
      var btnPause = document.getElementById('btnPause');
      var btnSiapNadia = document.getElementById('btnSiapNadia');
      var bgMusic = document.getElementById('bgMusic');

      bgMusic.volume = 0.35;

      var savedPos2Time = parseFloat(localStorage.getItem('jelita_pos2_bgm_time') || 0);
      var isMuted = localStorage.getItem('jelita_bgm_muted') === 'true';

      function playMusic() {
        if (!isMuted) {
          if (savedPos2Time > 0) {
            try { bgMusic.currentTime = savedPos2Time; } catch(e){}
          }
          bgMusic.play().catch(function() {
            function unlock() {
              bgMusic.play();
              document.removeEventListener('click', unlock);
              document.removeEventListener('touchstart', unlock);
            }
            document.addEventListener('click', unlock);
            document.addEventListener('touchstart', unlock);
          });
        }
      }

      if (bgMusic.readyState >= 1) {
        playMusic();
      } else {
        bgMusic.addEventListener('loadedmetadata', playMusic, { once: true });
      }

      bgMusic.addEventListener('timeupdate', function() {
        if (!bgMusic.paused && bgMusic.currentTime > 0) {
          localStorage.setItem('jelita_pos2_bgm_time', bgMusic.currentTime.toString());
        }
      });

      if (btnSound) {
        btnSound.addEventListener('click', function() {
          localStorage.setItem('jelita_bgm_muted', 'false');
          bgMusic.play();
        });
      }

      if (btnPause) {
        btnPause.addEventListener('click', function() {
          localStorage.setItem('jelita_bgm_muted', 'true');
          bgMusic.pause();
        });
      }

      if (btnHome) {
        btnHome.addEventListener('click', function(e) {
          e.preventDefault();
          masukFullScreen();
          localStorage.removeItem('jelita_pos2_bgm_time');
          window.location.href = 'menu.html';
        });
      }

      if (btnSiapNadia) {
        btnSiapNadia.addEventListener('click', function(e) {
          e.preventDefault();
          masukFullScreen();
          if (!bgMusic.paused) {
            localStorage.setItem('jelita_pos2_bgm_time', bgMusic.currentTime.toString());
          }
          window.location.href = 'pos2.html';
        });
      }
    });
  </script>
</body>
</html>
