<!DOCTYPE html>
<html lang="id">
  <link rel="stylesheet" href="jelita-fix.css">
  <script src="jelita-fix.js" defer></script>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>JELITA - Puncak Ekspedisi Kahyangan</title>
  <link rel="manifest" href="manifest.json">
  <link rel="prefetch" href="menu.html">
  <link rel="prefetch" href="index.html">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body { width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background-color: #1b5e20; }

    .finish-container { position: relative; width: 100%; height: 100%; background: #2e7d32 url('assets/images/finish.png') no-repeat center center; background-size: 100% 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 10px 10px 12dvh 10px; }

    .brand-logo { position: absolute; top: 3.5%; left: 2.5%; height: 13dvh; max-height: 65px; width: auto; z-index: 100; pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }

    .top-nav-group { position: absolute; top: 3.5%; right: 3%; display: flex; gap: 1.5dvh; align-items: center; z-index: 100; }
    .nav-icon-btn { height: 10dvh; max-height: 50px; width: auto; cursor: pointer; transition: transform 0.15s ease; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3)); }
    .nav-icon-btn:hover { transform: scale(1.1); }

    .ipa-logo { position: absolute; bottom: 3.5%; right: 2.5%; height: 13dvh; max-height: 65px; width: auto; z-index: 100; pointer-events: none; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }

    .attribution-text { position: absolute; bottom: 3%; left: 2.5%; color: #ffffff; font-size: clamp(9px, 2.2dvh, 11px); font-weight: 600; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); z-index: 100; background: rgba(0, 0, 0, 0.45); padding: 4px 10px; border-radius: 12px; }

    /* Desain Sertifikat Cerah & Mewah */
    .result-card {
      width: min(76vw, 560px);
      max-height: 68dvh;
      background: linear-gradient(180deg, #ffffff 0%, #fffdf5 60%, #fff3c4 100%);
      border: 4px solid #795548;
      outline: 3px solid #ffd54f;
      outline-offset: -8px;
      border-radius: 26px;
      padding: 2.2dvh 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.55), 0 0 25px rgba(255, 224, 130, 0.45);
      z-index: 10;
    }

    .result-title {
      font-size: clamp(11px, 2.4dvh, 13.5px);
      font-weight: 800;
      color: #2e7d32;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .player-name-big {
      font-size: clamp(24px, 6.2dvh, 40px);
      font-weight: 900;
      color: #d32f2f;
      text-transform: uppercase;
      margin: 1px 0 0.8dvh 0;
      letter-spacing: 1.5px;
      text-shadow: 0 2px 0 #ffe082, 0 4px 8px rgba(211, 47, 47, 0.2);
      text-align: center;
    }

    .title-badge-royal {
      background: linear-gradient(135deg, #e53935 0%, #b71c1c 100%);
      color: #ffffff;
      font-size: clamp(11px, 2.7dvh, 15.5px);
      font-weight: 900;
      padding: 1dvh 20px;
      border-radius: 30px;
      border: 2.5px solid #ffd54f;
      box-shadow: 0 4px 12px rgba(211, 47, 47, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.4);
      margin-bottom: 1.5dvh;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.45);
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .stats-container {
      display: flex;
      justify-content: space-around;
      width: 100%;
      background: #ffffff;
      border: 2px solid #ffe082;
      border-radius: 18px;
      padding: 1.3dvh 8px;
      margin-bottom: 1.6dvh;
      box-shadow: 0 4px 10px rgba(141, 110, 99, 0.12);
    }

    .stat-item { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .stat-item:not(:last-child) { border-right: 2px dashed #ffe082; }
    .stat-val { font-size: clamp(16px, 4.2dvh, 24px); font-weight: 900; color: #2e7d32; }
    .stat-lbl { font-size: clamp(10px, 2.2dvh, 12px); font-weight: 700; color: #2e7d32; margin-top: 2px; }

    .action-btn-group { display: flex; gap: 16px; }
    .btn-action {
      padding: 1.2dvh 26px;
      font-size: clamp(12px, 3dvh, 15px);
      font-weight: 800;
      border: none;
      border-radius: 24px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .btn-action:hover { transform: translateY(-2px) scale(1.03); }
    .btn-restart {
      background: linear-gradient(180deg, #ffb300 0%, #fb8c00 100%);
      border: 2px solid #fff8e1;
      box-shadow: 0 4px 0 #e65100, 0 6px 12px rgba(0, 0, 0, 0.25);
    }
    .btn-exit {
      background: linear-gradient(180deg, #ef5350 0%, #d32f2f 100%);
      border: 2px solid #ffebee;
      box-shadow: 0 4px 0 #b71c1c, 0 6px 12px rgba(0, 0, 0, 0.25);
    }

    #rotate-warning { display: none; position: fixed; inset: 0; background: #1b5e20; color: #ffffff; z-index: 99999; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; }
    @media screen and (orientation: portrait) { #rotate-warning { display: flex; } }
  </style>
</head>
<body>

  <div id="rotate-warning">
    <div style="font-size: 56px; margin-bottom: 12px;">📱🔄</div>
    <h2>Putar Layar HP Kamu</h2>
    <p style="margin-top: 8px; font-size: 14px; opacity: 0.9;">Miringkan HP ke posisi mendatar (Landscape) agar game tampil penuh dan rapi.</p>
  </div>

  <img src="assets/images/jelita.png" alt="JELITA Logo" class="brand-logo">

  <div class="top-nav-group">
    <img src="assets/images/home.png" alt="Menu Utama" class="nav-icon-btn" onclick="exitToMenu()" title="Kembali ke Menu Utama">
    <img src="assets/images/sound.png" id="soundBtnIcon" alt="Sound" class="nav-icon-btn" onclick="toggleAudio()" title="Putar/Matikan Suara">
    <img src="assets/images/pause.png" alt="Pause" class="nav-icon-btn" onclick="pauseAudio()" title="Jeda Audio">
  </div>

  <img src="assets/images/ipa.png" alt="IPA Logo" class="ipa-logo">

  <div class="attribution-text">
    Visual: DALL-E | Audio: Pixabay (Free Royalty)
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="assets/audio/audio5.mp3" type="audio/mpeg">
  </audio>

  <div class="finish-container">
    <div class="result-card">
      <div class="result-title">Selamat Atas Keberhasilan</div>
      <div class="player-name-big" id="displayPlayerName">PETUALANG</div>
      
      <div class="title-badge-royal">
        <span>🍃</span> DUTA PELINDUNG WANA KAHYANGAN <span>🍃</span>
      </div>

      <div class="stats-container">
        <div class="stat-item">
          <span class="stat-val" id="valStars">0 / 62</span>
          <span class="stat-lbl">⭐ Total Bintang</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="valLives">0 / 9</span>
          <span class="stat-lbl">❤️ Sisa Nyawa</span>
        </div>
        <div class="stat-item">
          <span class="stat-val" id="valTime">0s</span>
          <span class="stat-lbl">⏱️ Sisa Waktu</span>
        </div>
      </div>

      <div class="action-btn-group">
        <button class="btn-action btn-restart" onclick="restartGame()">🔄 Main Lagi</button>
        <button class="btn-action btn-exit" onclick="exitToMenu()">🚪 Keluar</button>
      </div>
    </div>
  </div>
  <script>
    function masukFullScreen() {
      var elem = document.documentElement;
      if (!document.fullscreenElement && elem.requestFullscreen) {
        elem.requestFullscreen().catch(function() {});
      } else if (!document.webkitFullscreenElement && elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
      }
    }
    document.addEventListener('touchstart', masukFullScreen, { once: true });
    document.addEventListener('click', masukFullScreen, { once: true });

    window.onload = function() {
      initAudio();
      displayFinalStats();
    };

    function initAudio() {
      var audio = document.getElementById('bgMusic');
      if (!audio) return;
      audio.volume = 0.5;
      var isMuted = localStorage.getItem('jelita_bgm_muted') === 'true';
      if (!isMuted) {
        var playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(function() {
            window.addEventListener('click', function unlock() {
              audio.play();
              window.removeEventListener('click', unlock);
            }, { once: true });
          });
        }
      }
    }

    function toggleAudio() {
      var audio = document.getElementById('bgMusic');
      if (!audio) return;
      if (audio.paused) {
        localStorage.setItem('jelita_bgm_muted', 'false');
        audio.play();
      } else {
        localStorage.setItem('jelita_bgm_muted', 'true');
        audio.pause();
      }
    }

    function pauseAudio() {
      var audio = document.getElementById('bgMusic');
      if (audio) {
        localStorage.setItem('jelita_bgm_muted', 'true');
        audio.pause();
      }
    }

    function displayFinalStats() {
      var name = localStorage.getItem('jelita_player_name') || 'Petualang';
      document.getElementById('displayPlayerName').innerText = name;

      var score1 = parseInt(localStorage.getItem('jelita_score_pos1') || '0');
      var stars1 = parseInt(localStorage.getItem('jelita_stars_pos1') || '0');
      var score2 = parseInt(localStorage.getItem('jelita_score_pos2') || '0');
      var stars2 = parseInt(localStorage.getItem('jelita_stars_pos2') || '0');
      var score3 = parseInt(localStorage.getItem('jelita_score_pos3') || '0');
      var stars3 = parseInt(localStorage.getItem('jelita_stars_pos3') || '0');

      var totalStars = (score1 + stars1) + (score2 + stars2) + (score3 + stars3);

      var lives1 = parseInt(localStorage.getItem('jelita_pos1_lives') || '3');
      var lives2 = parseInt(localStorage.getItem('jelita_pos2_lives') || '3');
      var lives3 = parseInt(localStorage.getItem('jelita_pos3_lives') || '3');
      var totalLives = lives1 + lives2 + lives3;

      var time1 = parseInt(
        localStorage.getItem('jelita_time_pos1') || 
        localStorage.getItem('jelita_pos1_time') || 
        localStorage.getItem('jelita_time_left_pos1') || '0'
      );

      var time2 = parseInt(
        localStorage.getItem('jelita_time_pos2') || 
        localStorage.getItem('jelita_pos2_time') || 
        localStorage.getItem('jelita_time_left_pos2') || '0'
      );

      var time3 = parseInt(
        localStorage.getItem('jelita_time_pos3') || 
        localStorage.getItem('jelita_pos3_time') || 
        localStorage.getItem('jelita_time_left_pos3') || 
        localStorage.getItem('jelita_timer_pos3') || '0'
      );

      var totalTimeRemaining = time1 + time2 + time3;

      document.getElementById('valStars').innerText = totalStars + ' / 62';
      document.getElementById('valLives').innerText = totalLives + ' / 9';
      document.getElementById('valTime').innerText = totalTimeRemaining + 's';
    }

    function restartGame() {
      masukFullScreen();
      try {
        localStorage.removeItem('jelita_score_pos1');
        localStorage.removeItem('jelita_score_pos2');
        localStorage.removeItem('jelita_score_pos3');
        localStorage.removeItem('jelita_pos3_lives');
        sessionStorage.clear();
      } catch(e) {}
      window.location.href = 'name.html';
    }

    function exitToMenu() {
      masukFullScreen();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
