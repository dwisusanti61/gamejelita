<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JELITA - Petunjuk Pos 3</title>
  <link rel="manifest" href="manifest.json">
  <link rel="prefetch" href="pos3.html">
  <link rel="prefetch" href="menu.html">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #00796b;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    .game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #00796b url('assets/images/pos03.png') no-repeat center center;
      background-size: cover;
    }

    /* POJOK KIRI BAWAH: jelita.png (DIPINDAHKAN KE BAWAH) */
    .bottom-left-logo {
      position: absolute;
      bottom: 3.5%;
      left: 2%;
      z-index: 1000;
    }

    .bottom-left-logo img {
      height: min(10vw, 70px);
      width: auto;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
    }

    /* POJOK KANAN ATAS: home, sound, pause */
    .top-right-controls {
      position: absolute;
      top: 3.5%;
      right: 3%;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
    }

    .top-right-controls button {
      background: none;
      border: none;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s ease;
    }

    .top-right-controls button:hover {
      transform: scale(1.1);
    }

    .top-right-controls img {
      height: min(8vw, 55px);
      width: auto;
      filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.4));
    }

    /* POJOK KANAN BAWAH: siap.png ke pos3.html */
    .btn-siap {
      position: absolute;
      bottom: 4%;
      right: 3%;
      background: none;
      border: none;
      cursor: pointer;
      z-index: 1000;
      outline: none;
      transition: transform 0.2s ease;
    }

    .btn-siap:hover {
      transform: scale(1.08);
    }

    .btn-siap img {
      height: min(15vw, 95px);
      width: auto;
      filter: drop-shadow(0px 6px 12px rgba(0,0,0,0.6));
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <!-- AUDIO4.MP3 OTOMATIS DIPUTAR -->
    <audio id="bgMusic" loop preload="auto">
      <source src="assets/audio/audio4.mp3" type="audio/mpeg">
    </audio>

    <!-- POJOK KIRI BAWAH -->
    <div class="bottom-left-logo">
      <img src="assets/images/jelita.png" alt="JELITA Logo">
    </div>

    <!-- POJOK KANAN ATAS -->
    <div class="top-right-controls">
      <button id="btnHome" onclick="goHome()" title="Menu Utama"><img src="assets/images/home.png" alt="Home"></button>
      <button id="btnSound" onclick="playAudio()" title="Nyalakan Suara"><img src="assets/images/sound.png" alt="Sound"></button>
      <button id="btnPause" onclick="pauseAudio()" title="Matikan Suara"><img src="assets/images/pause.png" alt="Pause"></button>
    </div>

    <!-- POJOK KANAN BAWAH -->
    <button class="btn-siap" onclick="goToPos3Arena()" title="Siap Main">
      <img src="assets/images/siap.png" alt="Siap">
    </button>
  </div>

  <script>
    var bgMusic = document.getElementById('bgMusic');

    function playAudio() {
      if (bgMusic) {
        localStorage.setItem('jelita_bgm_muted', 'false');
        bgMusic.play().catch(function(){});
      }
    }

    function pauseAudio() {
      if (bgMusic) {
        localStorage.setItem('jelita_bgm_muted', 'true');
        bgMusic.pause();
      }
    }

    function goHome() {
      if (bgMusic && !bgMusic.paused) {
        localStorage.setItem('jelita_pos3_bgm_time', bgMusic.currentTime.toString());
      }
      window.location.href = 'menu.html';
    }

    function goToPos3Arena() {
      if (bgMusic && !bgMusic.paused) {
        localStorage.setItem('jelita_pos3_bgm_time', bgMusic.currentTime.toString());
      }
      window.location.href = 'pos3.html';
    }

    window.onload = function() {
      if (bgMusic) {
        bgMusic.volume = 0.35;
        var isMuted = localStorage.getItem('jelita_bgm_muted') === 'true';

        if (!isMuted) {
          bgMusic.play().catch(function() {
            document.addEventListener('click', function unlock() {
              bgMusic.play();
              document.removeEventListener('click', unlock);
            }, { once: true });
          });
        }

        bgMusic.addEventListener('timeupdate', function() {
          if (!bgMusic.paused && bgMusic.currentTime > 0) {
            localStorage.setItem('jelita_pos3_bgm_time', bgMusic.currentTime.toString());
          }
        });
      }
    };
  </script>
</body>
</html>
